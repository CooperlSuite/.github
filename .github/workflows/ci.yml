name: Repository Mirroring

on: [push, delete]

jobs:
  mirror_to_gitlab:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Mirror to GitLab Transfo
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@ssh.gitlab.transfo.tools:digital_factory/csuite-v1/github.git
          ssh_private_key: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
